# 本機開發 / 尚未申請憑證時使用的 HTTP 設定。
# 正式上線改用 nginx/https/splitmate-https.conf.example（步驟見 README）。

server {
    # 只監聽 IPv4：容器內 IPv6 常被停用，寫 listen [::]:80 會讓 nginx 啟動失敗（Address family not supported）；
    # 主機對外的 IPv6 由 Docker port mapping 處理，容器內不需要另外監聽
    listen 80;
    # 本機用 localhost；VPS 上可改成你的網域，例如 splitmate.example.com
    server_name _;

    # 共用的 location 設定（靜態檔、快取、/api 反向代理）抽到 snippet，
    # HTTP 與 HTTPS 兩份 server 設定都 include 同一份，避免重複維護（DRY）
    include /etc/nginx/snippets/splitmate-locations.conf;
}
