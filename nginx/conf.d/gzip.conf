# conf.d/*.conf 會被 /etc/nginx/nginx.conf 在 http { } 區塊內 include，
# 所以這裡的指令作用於 http 層級，所有 server（HTTP 與 HTTPS）共用。

# 為什麼需要 gzip：Vue + Element Plus 打包後的 JS/CSS 動輒數百 KB，
# 文字類資源壓縮後通常只剩 20%~30%，可大幅縮短首次載入時間。
gzip on;

# 壓縮等級 1~9：越高越省頻寬但越吃 CPU；5 是常見的折衷值，再往上收益很小
gzip_comp_level 5;

# 太小的回應壓縮後反而可能變大，而且浪費 CPU，因此小於 1KB 不壓縮
gzip_min_length 1024;

# 請求若經過 CDN / 其他代理（帶 Via header），nginx 預設不壓縮；設 any 讓這類請求也能拿到壓縮版本
gzip_proxied any;

# 回應加上 Vary: Accept-Encoding，避免中間快取把壓縮版本回給不支援 gzip 的客戶端
gzip_vary on;

# 只壓縮文字類型；text/html 預設就會壓縮，不需列出（列出會出現 duplicate MIME type 警告）
# 圖片（png/jpg/webp）本身已壓縮過，再 gzip 沒有效益
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;
