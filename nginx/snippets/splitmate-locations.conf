# 由 server { } 區塊 include，HTTP 與 HTTPS 共用。

# 不在錯誤頁與 Server header 洩漏 nginx 版本號，減少被針對已知漏洞掃描的資訊
server_tokens off;

# Vue build 產物（dist/）在 nginx 映像中的位置
root /usr/share/nginx/html;
index index.html;

# ------------------------------------------------------------
# /api/ 反向代理到 Spring Boot
# ------------------------------------------------------------
# 為什麼需要：前端與 API 同網域（同源），瀏覽器不會觸發 CORS，也不用把後端 port 對外開放。
location /api/ {
    # proxy_pass 後面「不加 URI」（沒有結尾的 /），nginx 會把原始路徑 /api/xxx 原封不動轉給後端；
    # 若寫成 http://backend:8080/ 則會把 /api/ 前綴去掉，兩者差一個斜線行為完全不同，是常見踩雷點。
    # backend 是 docker compose 的服務名稱，由 Docker 內建 DNS 解析。
    proxy_pass http://backend:8080;

    # 保留瀏覽器原本請求的 Host，後端產生絕對網址（例如邀請連結）時才不會變成 backend:8080
    proxy_set_header Host $host;
    # 後端看到的連線來源是 nginx 容器 IP；這個 header 帶真實的用戶端 IP，供記錄與限流使用
    proxy_set_header X-Real-IP $remote_addr;
    # 標準的代理鏈 header：在既有值後面附加用戶端 IP，經過多層代理時仍可追溯
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 告訴後端原始請求是 http 還是 https（TLS 在 nginx 終止，後端永遠只收到 http）
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ------------------------------------------------------------
# 帶 hash 的靜態資源：長快取
# ------------------------------------------------------------
# 為什麼可以快取一年：Vite build 會在檔名加上內容 hash（例如 index-BX3k9a.js），
# 內容一變檔名就變，所以同一個檔名的內容永遠不會改，瀏覽器可放心長期快取。
location /assets/ {
    # immutable：告訴瀏覽器在有效期內連「重新整理」都不必再發請求驗證
    add_header Cache-Control "public, max-age=31536000, immutable";
    # 找不到檔案就直接 404，不能 fallback 到 index.html（否則瀏覽器會把 HTML 當成 JS 解析而報錯）
    try_files $uri =404;
}

# ------------------------------------------------------------
# index.html：不快取
# ------------------------------------------------------------
# 為什麼需要：index.html 檔名固定，裡面引用的是「最新一版」帶 hash 的 JS/CSS。
# 若 index.html 被快取，使用者會一直載入舊版前端，部署新版看不到效果。
# no-cache 不是「不存」，而是「每次使用前都要向伺服器驗證」（搭配 ETag，沒變只回 304，成本很低）。
location = /index.html {
    add_header Cache-Control "no-cache";
}

# ------------------------------------------------------------
# Vue Router history 模式 fallback
# ------------------------------------------------------------
# 為什麼需要：history 模式的網址（例如 /groups/1）在伺服器上並沒有對應檔案，
# 使用者直接開啟或重新整理時，nginx 會回 404。
# try_files 依序找：實體檔案 → 目錄 → 都沒有就回 /index.html，交給前端路由決定要顯示哪一頁。
# 內部轉到 /index.html 時會再匹配上面的 location = /index.html，因此同樣帶 no-cache。
location / {
    try_files $uri $uri/ /index.html;
}

# 注意：add_header 有「繼承陷阱」——只要某個 location 自己寫了 add_header，
# 外層（server / http）的 add_header 就全部不會被繼承。若之後要加全站安全性 header，
# 需要在每個有 add_header 的 location 內重複宣告（或使用 include 另一個 snippet）。
