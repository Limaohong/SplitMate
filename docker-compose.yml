# SplitMate：nginx（前端靜態檔 + 反向代理）、backend（Spring Boot）、postgres 三個服務
# 啟動：cp .env.example .env && docker compose up -d --build
name: splitmate

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      # 具名 volume：容器刪除後資料仍保留（docker compose down -v 才會清掉）
      - postgres-data:/var/lib/postgresql/data
    ports:
      # 只綁 127.0.0.1：本機開發可連，VPS 對外不開放 DB
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      # 讓 backend 等 DB 真正可連線後才啟動，避免 Flyway 啟動時連不到 DB
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    # 不對外開 port：所有流量必須經過 nginx 的 /api/

  nginx:
    build:
      # 以專案根目錄為 context，因為映像同時需要 frontend 原始碼（建置）與 nginx 設定
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres-data:
